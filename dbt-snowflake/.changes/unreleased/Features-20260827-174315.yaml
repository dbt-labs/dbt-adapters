kind: Features
body: 'Add the `snowflake_dynamic_table_create_or_alter` behavior flag. When enabled,
    native and managed Iceberg dynamic tables are synced with CREATE OR ALTER on every
    run, so edits to the model''s SQL deploy without `--full-refresh`. Note: for INCREMENTAL
    and AUTO refresh modes, a definition edit reinitializes the table (incremental
    state is discarded). Schema changes that CREATE OR ALTER cannot express (e.g.
    column reorder, mid-list insert) still require `--full-refresh`, and a failed
    CREATE OR ALTER gets a hint saying so. Converting between a native and an Iceberg
    dynamic table is rebuilt with CREATE OR REPLACE.'
time: 2026-08-27T17:43:15.027603+00:00
