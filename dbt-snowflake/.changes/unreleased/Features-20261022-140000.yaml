kind: Features
body: Support `base_location_root` and `base_location_subpath` for Iceberg REST catalog-linked databases, emitting `BASE_LOCATION` as Snowflake requires for catalogs that vend credentials. There is no default, but `base_location_root` set in project or model config, which was previously ignored for these models, will now be applied to them
