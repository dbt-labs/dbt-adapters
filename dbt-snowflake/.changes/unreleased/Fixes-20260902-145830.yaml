kind: Fixes
body: 'Compare a dynamic table''s refresh warehouse case-insensitively when detecting
    configuration changes: Snowflake folds unquoted warehouse names to upper case
    on readback, so a desired `my_wh` compared against a reported `MY_WH` was treated
    as a change and fired a spurious ALTER on every run'
