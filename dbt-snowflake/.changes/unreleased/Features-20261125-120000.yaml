kind: Features
body: 'Snowflake custom incremental dynamic tables: a `dynamic_table` model with `refresh_mode=''CUSTOM_INCREMENTAL''`
    and `incremental_strategy=''merge''` deploys as `refresh using (merge into SELF ...)`,
    with optional `delete_condition`, and reads its change source with the new `changes(relation,
    mode)` macro.'
