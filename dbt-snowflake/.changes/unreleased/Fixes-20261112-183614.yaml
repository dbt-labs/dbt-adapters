kind: Fixes
body: Render the dynamic table `as (...)` query block identically in CREATE, CREATE OR REPLACE and CREATE OR ALTER, so Snowflake does not see a definition change (and reinitialize the table) on the first CREATE OR ALTER after a create. Omit an unset `base_location` from CREATE OR REPLACE DYNAMIC ICEBERG TABLE instead of rendering `'None'`.
