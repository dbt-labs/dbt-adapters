spark.driver.memory 2g
spark.executor.memory 2g
spark.hadoop.datanucleus.autoCreateTables	true
spark.hadoop.datanucleus.schema.autoCreateTables	true
spark.hadoop.datanucleus.fixedDatastore 	false
spark.serializer	org.apache.spark.serializer.KryoSerializer
spark.jars.packages	org.apache.hudi:hudi-spark3-bundle_2.12:0.10.0,org.apache.iceberg:iceberg-spark-runtime-3.1_2.12:1.3.1
spark.sql.extensions	org.apache.spark.sql.hudi.HoodieSparkSessionExtension,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.spark_catalog	org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type	hive
spark.driver.userClassPathFirst true
