kind: Fixes
body: Stop emitting a spurious snapshot timestamp data type warning when hard_deletes resolves
    to ignore. snapshot_get_time only feeds the SCD timestamp columns under hard_deletes invalidate
    or new_record, so the comparison against the updated_at-derived column was a false positive
    for the default configuration
